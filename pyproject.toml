readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "behave>=1.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
